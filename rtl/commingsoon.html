	<section class="commingsoon">
		<div class="container">
			<div class="row">
				<div class="col-md-8 offset-md-2">
					<div class="com-logo">
						<img src="../assets/img/logo-commingsoon.png" alt="">
					</div>
					<div class="comming-content">
						<h1>نحن قادمون قريبا</h1>
						<p>نحن نعمل حاليًا على موقع جديد رائع. لا تنزعج لمزيد من المعلومات. اشترك في النشرة الإخبارية للبقاء على اطلاع على تقدمنا
						</p>
					</div>
					<div id="clockdiv">
						<div class="time">
							<span class="days"></span>
							<div class="smalltext">أيام</div>
						</div>
						<div class="dot">:</div>
						<div class="time">
							<span class="hours"></span>
							<div class="smalltext">ساعات</div>
						</div>
						<div class="dot">:</div>
						<div class="time">
							<span class="minutes"></span>
							<div class="smalltext">الدقائق</div>
						</div>
						<div class="dot">:</div>
						<div class="time">
							<span class="seconds"></span>
							<div class="smalltext">الثواني</div>
						</div>
					</div>
					<div class="subscribe">
						<form>
							<input type="text" class="form-control" placeholder=" أدخل عنوان بريدك الالكتروني....."
								onfocus="this.placeholder=''" onblur="this.placeholder='أدخل عنوان بريدك الالكتروني.....'">
							<button type="submit" class="btn btn-primary sub-btn"> الإشتراك </button>
						</form>
					</div>
					<div class="comming-social">
						<ul>
							<li><a href="#"><i class="flaticon-twitter"></i></a></li>
							<li><a href="#"><i class="flaticon-facebook"></i></a></li>
							<li><a href="#"><i class="flaticon-instagram"></i></a></li>
							<li><a href="#"><i class="flaticon-linkedin"></i></a></li>
						</ul>
					</div>
				</div>
			</div>
		</div>
	</section>
